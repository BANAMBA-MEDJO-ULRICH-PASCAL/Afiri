<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Afiri - Profil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styliste.css">
</head>
<body>
  <div class="app-shell">
    <header class="pagebar">
      <a class="back-btn" href="index.html" aria-label="Retour">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <div><span class="page-kicker">Mini-CV étudiant</span><strong class="page-title">Profil</strong></div>
      <button class="more-btn" aria-label="Options">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      </button>
    </header>

    <main class="screen tight profile-stack">

      <!-- Carte hero profil -->
      <section class="white-card profile-hero">
        <div class="profile-head">
          <span class="avatar big"></span>
          <div>
            <h1 id="profilNom">Chargement…</h1>
            <p id="profilFormation"></p>
          </div>
        </div>
        <strong class="label-strong" id="profilCompletion">Profil complété à 0%</strong>
        <div class="progress"><span id="progressBar" style="width:0%"></span></div>
      </section>

      <!-- Compétences -->
      <section class="white-card card-block">
        <h2>Compétences</h2>
        <div class="chips" id="competencesChips">
          <span style="color:var(--muted);font-size:13px;">—</span>
        </div>
      </section>

      <!-- Expériences -->
      <section class="white-card card-block project">
        <h2>Expériences</h2>
        <p id="experiencesTexte" style="color:var(--muted);font-size:14px;">—</p>
      </section>

      <!-- Actions -->
      <section class="white-card card-block" style="display:flex;flex-direction:column;gap:12px;padding:20px;">
        <button class="wide-action" id="btnCV" style="width:100%;background:var(--green);color:white;" onclick="ouvrirCV()">Consulter mon CV</button>
        <button class="wide-action" style="width:100%;" onclick="copierLien()">Copier le lien du profil</button>
        <button class="wide-action" style="width:100%;background:var(--primary);color:white;" onclick="window.location.href='profil-edit.html'">Modifier mon profil</button>
        <button class="wide-action" style="width:100%;background:#f5f5f5;color:var(--ink);" onclick="Auth.logout()">Se déconnecter</button>
      </section>

      <!-- Message si pas encore de profil -->
      <section id="noProfil" class="white-card card-block" style="display:none;text-align:center;padding:32px 20px;">
        <p style="color:var(--muted);margin-bottom:16px;">Tu n'as pas encore créé ton profil étudiant.</p>
        <a href="questionnaire.html" class="pill-action" style="text-decoration:none;">Créer mon profil</a>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Navigation principale">
      <a class="nav-item" href="index.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8v8.7a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5z"/></svg></span><span>Accueil</span></a>
      <a class="nav-item" href="offres.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M9 4h6a2 2 0 0 1 2 2v1h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3V6a2 2 0 0 1 2-2Zm0 3h6V6H9zM7 13h10v-2H7zm0 4h6v-2H7z"/></svg></span><span>Offres</span></a>
      <a class="nav-item" href="quizz.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M11 17h2v-2h-2zm1-14a6 6 0 0 0-6 6h4a2 2 0 1 1 2 2 3 3 0 0 0-3 3h4a1 1 0 0 1 1-1 6 6 0 0 0-2-10z"/></svg></span><span>Quiz</span></a>
      <a class="nav-item active" href="profil.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm-9 9a9 9 0 0 1 18 0z"/></svg></span><span>Profil</span></a>
    </nav>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="main.js"></script>
  <script>
    let profilData = null;

    const CHIP_COLORS = ["orange", "purple", "yellow", "green"];

    function ouvrirCV() {
      if (profilData && profilData.cv_lien) window.open(profilData.cv_lien, "_blank");
      else alert("Aucun lien CV enregistré dans ton profil.");
    }

    function copierLien() {
      if (profilData && profilData.lien_partage) {
        const url = `${window.location.origin}/profil-public.html?id=${profilData.lien_partage}`;
        navigator.clipboard.writeText(url).then(() => alert("Lien copié !")).catch(() => alert(url));
      } else {
        alert("Lien de partage indisponible.");
      }
    }

    (async () => {
      if (!Auth.isLoggedIn()) { window.location.href = "signup.html"; return; }

      try {
        profilData = await ApiProfil.moi();

        // Nom + formation
        document.getElementById("profilNom").textContent = `${profilData.prenom} ${profilData.nom}`;
        const formation = [profilData.formation, profilData.universite].filter(Boolean).join(" · ");
        document.getElementById("profilFormation").textContent = formation || "—";

        // Complétion
        const pct = calculerCompletionProfil(profilData);
        document.getElementById("profilCompletion").textContent = `Profil complété à ${pct}%`;
        document.getElementById("progressBar").style.width = `${pct}%`;

        // Compétences (séparées par virgule dans la BDD)
        const chips = document.getElementById("competencesChips");
        if (profilData.competences) {
          const liste = profilData.competences.split(",").map(s => s.trim()).filter(Boolean);
          chips.innerHTML = liste.map((c, i) =>
            `<span class="chip ${CHIP_COLORS[i % CHIP_COLORS.length]}">${c}</span>`
          ).join("");
        }

        // Expériences
        if (profilData.experiences) {
          document.getElementById("experiencesTexte").textContent = profilData.experiences;
        }

      } catch (_) {
        // Pas de profil créé encore
        document.getElementById("profilNom").textContent = "Mon profil";
        document.getElementById("noProfil").style.display = "block";
      }
    })();
  </script>
</body>
</html>
