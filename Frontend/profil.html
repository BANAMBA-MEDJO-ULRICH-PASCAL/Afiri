<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Afiri - Profil</title>
    <link rel="stylesheet" href="styliste.css">
</head>

<body>
    <div class="app-shell">
        <header class="pagebar">
            <a class="back-btn" href="app.html" aria-label="Retour">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="m15 18-6-6 6-6" />
                </svg>
            </a>
            <div>
                <span class="page-kicker">Mini-CV étudiant</span>
                <strong class="page-title">Profil</strong>
            </div>
            <button class="more-btn" type="button" onclick="Auth.logout()" aria-label="Déconnexion" title="Déconnexion">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
                </svg>
            </button>
        </header>

        <main class="screen tight profile-stack">
            <section class="white-card profile-hero">
                <div class="profile-head" style="position: relative;">
                    <span class="avatar big"></span>
                    <div style="flex: 1; min-width: 0; padding-right: 80px;">
                        <h1>Chargement...</h1>
                        <p></p>
                    </div>
                    <button type="button" class="profile-edit-btn" id="editPersonalBtn" style="position: absolute; right: 0; top: 50%; transform: translateY(-50%);">Modifier</button>
                </div>
                <strong class="label-strong">Profil complété à 0%</strong>
                <div class="progress"><span style="width: 0%;"></span></div>
                <p class="profile-hint" style="margin-top: 12px; font-size: 13px; color: var(--muted); line-height: 1.4;"></p>
            </section>

            <section class="white-card card-block" data-profile-section="competences">
                <h2>Compétences</h2>
            </section>

            <section class="white-card card-block project" data-profile-section="experiences">
                <h2>Expériences</h2>
            </section>

            <section class="white-card card-block project" data-profile-section="projets">
                <h2>Projets</h2>
            </section>

            <section class="white-card card-block"
                style="display: flex; flex-direction: column; gap: 12px; padding: 20px;">
                <button class="wide-action" style="width: 100%; background: var(--green); color: white;">Consulter mon
                    CV</button>
                <button class="wide-action" type="button" data-copy-profile style="width: 100%;">Copier le lien du profil</button>
            </section>
        </main>

        <nav class="bottom-nav" aria-label="Navigation principale">
            <a class="nav-item" href="app.html"><span class="nav-icon"><img src="images/Home.svg" alt="" aria-hidden="true"></span><span>Accueil</span></a>
            <a class="nav-item" href="offres.html"><span class="nav-icon"><img src="images/offres.svg" alt="" aria-hidden="true"></span><span>Offres</span></a>
            <a class="nav-item" href="quizz.html"><span class="nav-icon"><img src="images/question.svg" alt="" aria-hidden="true"></span><span>Quiz</span></a>
            <a class="nav-item active" href="profil.html"><span class="nav-icon"><img src="images/profile.svg" alt="" aria-hidden="true"></span><span>Profil</span></a>
        </nav>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="main.js"></script>
</body>

</html>
