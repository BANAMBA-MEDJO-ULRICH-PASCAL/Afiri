<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Afiri - Offres</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styliste.css">
</head>
<body>
  <div class="app-shell">
    <header class="pagebar">
      <a class="back-btn" href="app.html" aria-label="Retour">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <div><span class="page-kicker">Explorer</span><strong class="page-title">Toutes les offres</strong></div>
      <label class="search-label" aria-label="Recherche">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="search-input" id="searchInput" type="search" placeholder="Rechercher…">
      </label>
    </header>

    <main class="screen tight">
      <!-- Filtres -->
      <div class="filters-row" style="display:flex;gap:8px;padding:12px 16px 0;overflow-x:auto;">
        <button class="filter active" data-type="">Tous</button>
        <button class="filter" data-type="stage">Stage</button>
        <button class="filter" data-type="cdi">CDI</button>
        <button class="filter" data-type="cdd">CDD</button>
      </div>

      <!-- Liste des offres injectée par JS -->
      <section class="offer-list" id="offerList" style="padding:12px 16px;">
        <p style="color:var(--muted);font-size:14px;">Chargement…</p>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Navigation principale">
      <a class="nav-item" href="app.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8v8.7a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5z"/></svg></span><span>Accueil</span></a>
      <a class="nav-item active" href="offres.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M9 4h6a2 2 0 0 1 2 2v1h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3V6a2 2 0 0 1 2-2Zm0 3h6V6H9zM7 13h10v-2H7zm0 4h6v-2H7z"/></svg></span><span>Offres</span></a>
      <a class="nav-item" href="quizz.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M11 17h2v-2h-2zm1-14a6 6 0 0 0-6 6h4a2 2 0 1 1 2 2 3 3 0 0 0-3 3h4a1 1 0 0 1 1-1 6 6 0 0 0-2-10z"/></svg></span><span>Quiz</span></a>
      <a class="nav-item" href="profil.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm-9 9a9 9 0 0 1 18 0z"/></svg></span><span>Profil</span></a>
    </nav>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="main.js"></script>
  <script>
    const DEMO_OFFRES = [
      { id: "front-end-react",    titre: "Stage Front-end React",       localisation: "Douala, Cameroun",    type_contrat: "Stage",  domaine: "Développement" },
      { id: "assistant-rh",       titre: "Assistant RH junior",          localisation: "Yaoundé, Cameroun",   type_contrat: "Alternance", domaine: "Ressources Humaines" },
      { id: "data-trainee",       titre: "Data trainee",                 localisation: "Akwa, Douala",        type_contrat: "Stage",  domaine: "Data" },
      { id: "community-manager",  titre: "Community manager",            localisation: "Buea, Cameroun",      type_contrat: "Temps partiel", domaine: "Marketing" },
      { id: "backend-node",       titre: "Développeur Back-end Node",    localisation: "Abidjan, Côte d'Ivoire", type_contrat: "Stage", domaine: "Développement" },
      { id: "ui-ux-designer",     titre: "UI/UX Designer",               localisation: "Yaoundé, Cameroun",   type_contrat: "Stage",  domaine: "Design" },
      { id: "chef-projet-digital",titre: "Chef de Projet Digital",       localisation: "Lagos, Nigeria",      type_contrat: "Stage",  domaine: "Gestion de projet" },
      { id: "marketing-digital",  titre: "Consultant Marketing Digital", localisation: "Accra, Ghana",        type_contrat: "Stage",  domaine: "Marketing" }
    ];

    let toutesLesOffres = [];
    let filtreActif = "";

    function renderOffres(offres) {
      const list = document.getElementById("offerList");
      if (!offres || offres.length === 0) {
        list.innerHTML = '<p style="color:var(--muted);font-size:14px;text-align:center;padding:40px 0;">Aucune offre trouvée.</p>'; return;
      }
      list.innerHTML = offres.map(o => `
        <article class="offer-card" data-tags="${(o.domaine||'').toLowerCase()} ${(o.type_contrat||'').toLowerCase()}" data-offre-id="${o.id}">
          <a class="offer-main" href="detail-offre.html?id=${o.id}">
            <span class="dot ${o.type_contrat === 'Stage' ? 'green' : o.type_contrat === 'Alternance' ? 'purple' : 'yellow'}"></span>
            <span class="offer-copy">
              <h3>${o.titre}</h3>
              <p>${o.localisation||'—'} · ${o.type_contrat||'—'}</p>
              <span>${o.domaine||'—'}</span>
            </span>
          </a>
          <a href="detail-offre.html?id=${o.id}" aria-label="Voir ${o.titre}" class="arrow">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
          </a>
        </article>
      `).join("");
    }

    function appliquerFiltre() {
      const search = document.getElementById("searchInput").value.toLowerCase().trim();
      const filtered = toutesLesOffres.filter(o => {
        const tags  = `${(o.domaine||'').toLowerCase()} ${(o.type_contrat||'').toLowerCase()}`;
        const texte = `${o.titre} ${o.localisation||''} ${o.domaine||''}`.toLowerCase();
        const okFiltre = !filtreActif || tags.includes(filtreActif);
        const okSearch = !search || texte.includes(search);
        return okFiltre && okSearch;
      });
      renderOffres(filtered);
    }

    (async () => {
      try {
        toutesLesOffres = await ApiOffres.lister() || [];
        if (toutesLesOffres.length === 0) throw new Error("vide");
      } catch (_) {
        toutesLesOffres = DEMO_OFFRES;
      }
      renderOffres(toutesLesOffres);

      // Filtres
      document.querySelectorAll(".filter").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".filter").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          filtreActif = btn.dataset.type;
          appliquerFiltre();
        });
      });

      // Recherche
      let timer;
      document.getElementById("searchInput").addEventListener("input", () => {
        clearTimeout(timer);
        timer = setTimeout(appliquerFiltre, 300);
      });
    })();
  </script>
</body>
</html>
