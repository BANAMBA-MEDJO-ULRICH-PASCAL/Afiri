<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Afiri - Offres</title>
    <link rel="stylesheet" href="styliste.css">
</head>

<body>
    <div class="app-shell">
        <header class="pagebar">
            <a class="back-btn" href="app.html" aria-label="Retour">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="m15 18-6-6 6-6" />
                </svg>
            </a>
            <div>
                <strong class="page-title">Offres</strong>
            </div>
            <button class="more-btn" aria-label="Options">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="12" cy="5" r="1.8" />
                    <circle cx="12" cy="12" r="1.8" />
                    <circle cx="12" cy="19" r="1.8" />
                </svg>
            </button>
        </header>

        <main class="screen tight">
            <label class="search-box">
                <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                    <circle cx="11" cy="11" r="7" />
                    <path d="m20 20-3.5-3.5" />
                </svg>
                <input class="search-input" type="search" placeholder="Rechercher une offre">
            </label>

            <div class="filter-row">
                <button class="filter active">Tous</button>
                <button class="filter">Stage</button>
                <button class="filter">Remote</button>
                <button class="filter">Plein</button>
                <button class="filter">Partiel</button>
            </div>

            <p class="hint">Les offres sont triées selon ton profil, ta ville et tes compétences.</p>

            <section class="offer-list">
                <p class="hint">Chargement des offres...</p>
            </section>
        </main>

        <nav class="bottom-nav" aria-label="Navigation principale">
            <a class="nav-item" href="app.html"><span class="nav-icon"><img src="images/Home.svg" alt="" aria-hidden="true"></span><span>Accueil</span></a>
            <a class="nav-item active" href="offres.html"><span class="nav-icon"><img src="images/offres.svg" alt="" aria-hidden="true"></span><span>Offres</span></a>
            <a class="nav-item" href="quizz.html"><span class="nav-icon"><img src="images/question.svg" alt="" aria-hidden="true"></span><span>Quiz</span></a>
            <a class="nav-item" href="profil.html"><span class="nav-icon"><img src="images/profile.svg" alt="" aria-hidden="true"></span><span>Profil</span></a>
        </nav>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="main.js"></script>
</body>

</html>
