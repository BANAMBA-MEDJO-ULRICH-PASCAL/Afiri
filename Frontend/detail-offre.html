<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Afiri - Offre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styliste.css">
</head>
<body>
  <div class="app-shell" data-offer-detail>
    <header class="detail-back-bar">
      <a class="detail-back" href="offres.html" aria-label="Retour aux offres">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg>
      </a>
    </header>

    <main class="screen tight detail-stack">
      <section class="white-card detail-hero">
        <h1 data-offer-title>Chargement…</h1>
        <p  data-offer-company class="detail-meta"></p>
        <p  data-offer-deadline class="detail-sub"></p>
      </section>

      <section class="white-card card-block">
        <h2>Description</h2>
        <p data-offer-description></p>
      </section>

      <section class="white-card card-block match-card">
        <h2>Pourquoi ce poste ?</h2>
        <p data-offer-match></p>
      </section>

      <section class="white-card card-block advice-card">
        <h2>Conseil Afiri</h2>
        <p data-offer-advice class="advice-text"></p>
      </section>

      <div style="padding: 0 16px 32px;">
        <button class="wide-action" id="btnPostuler" style="width:100%">Postuler à cette offre</button>
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="main.js"></script>
</body>
</html>
