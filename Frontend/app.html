<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Afiri - Accueil</title>
    <link rel="stylesheet" href="styliste.css">
</head>

<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="app.html" aria-label="Afiri accueil"><span class="brand-mark"><img
                        src="images/logo.svg" alt="logo"></span> Afiri</a>
            <label class="header-search">
                <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                    <circle cx="11" cy="11" r="7" />
                    <path d="m20 20-3.5-3.5" />
                </svg>
                <input type="search" placeholder="Rechercher une offre">
            </label>
            <a class="avatar" href="profil.html" aria-label="Voir le profil"></a>
        </header>

        <main class="screen home">
            <section class="banner">
                <small>Profil complété à 0%</small>
                <h1>Complète ton profil pour de meilleures recommandations.</h1>
                <div class="progress"><span style="width:0%"></span></div>
            </section>

            <h2 class="section-title">Recommandé pour toi</h2>

            <section class="job-list">
                <p class="hint">Chargement des recommandations...</p>
            </section>
        </main>

        <nav class="bottom-nav" aria-label="Navigation principale">
            <a class="nav-item active" href="app.html"><span class="nav-icon"><img src="images/Home.svg" alt="" aria-hidden="true"></span><span>Accueil</span></a>
            <a class="nav-item" href="offres.html"><span class="nav-icon"><img src="images/offres.svg" alt="" aria-hidden="true"></span><span>Offres</span></a>
            <a class="nav-item" href="quizz.html"><span class="nav-icon"><img src="images/question.svg" alt="" aria-hidden="true"></span><span>Quiz</span></a>
            <a class="nav-item" href="profil.html"><span class="nav-icon"><img src="images/profile.svg" alt="" aria-hidden="true"></span><span>Profil</span></a>
        </nav>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="main.js"></script>
</body>

</html>
