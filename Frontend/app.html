<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Afiri - Accueil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styliste.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="app.html" aria-label="Afiri accueil"><span class="brand-mark"><img src="images/logo.png" alt="logo"></span> Afiri</a>
      <label class="header-search">
        <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <input type="search" id="searchInput" placeholder="Rechercher une offre">
      </label>
      <a class="avatar" href="profil.html" aria-label="Voir le profil"></a>
    </header>

    <main class="screen home">
      <section class="banner">
        <small id="bannerCompletion">Profil complété à 0%</small>
        <h1 id="bannerMessage">Complète ton profil pour mieux matcher les offres.</h1>
        <div class="progress"><span id="progressBar" style="width:0%"></span></div>
      </section>

      <h2 class="section-title">Recommandé pour toi</h2>

      <!-- Les offres seront injectées ici par JS -->
      <section class="job-list" id="jobList">
        <p style="padding:16px;color:var(--muted);font-size:14px;">Chargement des offres…</p>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Navigation principale">
      <a class="nav-item" href="index.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8v8.7a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5z"/></svg></span><span>Accueil</span></a>
      <a class="nav-item" href="offres.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M9 4h6a2 2 0 0 1 2 2v1h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3V6a2 2 0 0 1 2-2Zm0 3h6V6H9zM7 13h10v-2H7zm0 4h6v-2H7z"/></svg></span><span>Offres</span></a>
      <a class="nav-item" href="quizz.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M11 17h2v-2h-2zm1-14a6 6 0 0 0-6 6h4a2 2 0 1 1 2 2 3 3 0 0 0-3 3h4a1 1 0 0 1 1-1 6 6 0 0 0-2-10z"/></svg></span><span>Quiz</span></a>
      <a class="nav-item" href="profil.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm-9 9a9 9 0 0 1 18 0z"/></svg></span><span>Profil</span></a>
    </nav>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="main.js"></script>
  <script>
    (async () => {
      // Protéger la page : rediriger si non connecté
      if (!Auth.isLoggedIn()) { window.location.href = "signup.html"; return; }

      // Charger le profil pour la barre de complétion
      try {
        const profil = await ApiProfil.moi();
        const pct    = calculerCompletionProfil(profil);
        document.getElementById("bannerCompletion").textContent = `Profil complété à ${pct}%`;
        document.getElementById("progressBar").style.width      = `${pct}%`;
        document.getElementById("bannerMessage").textContent    =
          pct >= 80 ? "Ton profil est prêt. Explore les offres !" :
          pct >= 50 ? "Ajoute tes expériences pour mieux matcher." :
                      "Complète ton profil pour mieux matcher les offres.";
      } catch (_) { /* pas de profil encore */ }

      // Charger les offres depuis l'API
      try {
        const offres = await ApiOffres.lister();
        const list   = document.getElementById("jobList");

        if (!offres || offres.length === 0) {
          list.innerHTML = '<p style="padding:16px;color:var(--muted);font-size:14px;">Aucune offre disponible pour le moment.</p>';
          return;
        }

        list.innerHTML = offres.slice(0, 6).map(o => `
          <article class="job-card" data-tags="${(o.domaine||'').toLowerCase()} ${(o.type_contrat||'').toLowerCase()}" data-offre-id="${o.id}">
            <a class="job-main" href="detail-offre.html?id=${o.id}">
              <span class="dot"></span>
              <span class="job-copy">
                <h3>${o.titre}</h3>
                <p>${o.entreprise_id}</p>
                <span>${o.localisation || '—'} · ${o.type_contrat || '—'} · ${o.domaine || '—'}</span>
              </span>
            </a>
            <a class="pill-action" href="detail-offre.html?id=${o.id}">Postuler</a>
          </article>
        `).join("");
      } catch (_) {
        // Fallback : afficher message d'erreur discret
        document.getElementById("jobList").innerHTML =
          '<p style="padding:16px;color:var(--muted);font-size:14px;">Impossible de charger les offres. Vérifiez que le serveur est démarré.</p>';
      }

      // Recherche dynamique via API
      const searchInput = document.getElementById("searchInput");
      if (searchInput) {
        let timer;
        searchInput.addEventListener("input", () => {
          clearTimeout(timer);
          timer = setTimeout(async () => {
            try {
              const offres = await ApiOffres.lister(searchInput.value.trim());
              const list   = document.getElementById("jobList");
              if (!offres || offres.length === 0) { list.innerHTML = '<p style="padding:16px;color:var(--muted);">Aucun résultat.</p>'; return; }
              list.innerHTML = offres.slice(0, 6).map(o => `
                <article class="job-card" data-tags="${(o.domaine||'').toLowerCase()}" data-offre-id="${o.id}">
                  <a class="job-main" href="detail-offre.html?id=${o.id}">
                    <span class="dot"></span>
                    <span class="job-copy"><h3>${o.titre}</h3><p>${o.entreprise_id}</p><span>${o.localisation||'—'} · ${o.type_contrat||'—'}</span></span>
                  </a>
                  <a class="pill-action" href="detail-offre.html?id=${o.id}">Postuler</a>
                </article>
              `).join("");
            } catch (_) {}
          }, 400);
        });
      }
    })();
  </script>
</body>
</html>
