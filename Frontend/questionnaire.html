<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Afiri - Questionnaire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styliste.css">
</head>
<body>
  <div class="app-shell">
    <main class="quiz-screen" data-quiz>
      <section class="quiz-progress">
        <small data-quiz-progress-text>0% complété</small>
        <div class="progress"><span data-quiz-progress></span></div>
      </section>

      <section data-quiz-panel>
        <p class="quiz-kicker" data-quiz-step>Question 1 sur 4</p>
        <h1 data-quiz-question>Chargement...</h1>
        <section class="answers" data-quiz-answers></section>
      </section>

      <section class="quiz-actions">
        <button data-quiz-back>Partir</button>
        <button class="next" data-quiz-next>Continuer</button>
      </section>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="main.js"></script>
</body>
</html>
