<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Afiri - Authentification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styliste.css">
  <style>
    .auth-morph-page {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(circle at 84% 6%, rgba(255,255,255,0.94) 0 12%, rgba(255,255,255,0) 28%),
        radial-gradient(circle at 0% 0%, rgba(255,219,115,0.9) 0 25%, rgba(255,219,115,0) 48%),
        radial-gradient(circle at 100% 26%, rgba(255,165,154,0.8) 0 20%, rgba(255,165,154,0) 43%),
        radial-gradient(circle at 50% 48%, rgba(255,247,228,0.72) 0 18%, rgba(255,247,228,0) 40%),
        linear-gradient(180deg,#fff8ed 0%,#ffd9d3 38%,#e7f1df 58%,#92e7ae 100%);
      padding: 20px; font-family: var(--font-ui); position: relative; overflow: hidden; box-sizing: border-box;
    }
    .auth-morph-card {
      background: rgba(255,255,255,0.65); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-radius: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.08), inset 0 0 0 1px rgba(255,255,255,0.4);
      width: 100%; max-width: 380px; position: relative;
      transition: height 0.5s cubic-bezier(0.4,0,0.2,1); overflow: hidden; box-sizing: border-box;
    }
    .auth-card-inner { padding: 36px 28px; position: absolute; top: 0; left: 0; width: 100%; box-sizing: border-box; }
    .auth-back-link {
      display: inline-block; font-size: 11.5px; font-weight: 700; color: var(--burgundy);
      text-decoration: none; margin-bottom: 16px; transition: opacity 0.3s ease;
    }
    .top-icon-container { display: flex; justify-content: center; margin-bottom: 20px; transition: opacity 0.3s ease; }
    .success-circle {
      width: 64px; height: 64px; border-radius: 50%; background: #49db80;
      display: flex; align-items: center; justify-content: center; color: #fff;
      box-shadow: 0 8px 16px rgba(73,219,128,0.3);
    }
    .auth-morph-title {
      font-family: var(--font-title); font-size: 26px; font-weight: 800; color: var(--ink);
      margin-bottom: 8px; transition: opacity 0.3s ease;
    }
    .auth-morph-title.center { text-align: center; }
    .auth-morph-subtitle { font-size: 13.5px; color: var(--muted); margin-bottom: 24px; line-height: 1.5; transition: opacity 0.3s ease; }
    .auth-morph-subtitle.center { text-align: center; }
    .auth-tabs {
      display: flex; background: #fff; border-radius: 999px; padding: 5px; margin-bottom: 24px;
      position: relative; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      transition: opacity 0.3s ease, margin 0.3s ease, height 0.3s ease; overflow: hidden;
    }
    .auth-tabs.hidden { opacity: 0; height: 0; margin-bottom: 0; padding: 0; pointer-events: none; }
    .auth-tab {
      flex: 1; text-align: center; padding: 10px 0; font-size: 13.5px; font-weight: 700; color: var(--ink);
      cursor: pointer; border-radius: 999px; z-index: 2; transition: color 0.3s ease;
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .auth-tab.active { color: #fff; }
    .auth-tab-indicator {
      position: absolute; top: 5px; bottom: 5px; width: calc(50% - 5px);
      background: var(--primary); border-radius: 999px;
      transition: transform 0.4s cubic-bezier(0.4,0,0.2,1), background 0.4s ease; z-index: 1;
    }
    .auth-tab-indicator.signup-mode { transform: translateX(100%); }
    .auth-tab-indicator.login-mode  { background: var(--burgundy); }
    .auth-views-container { position: relative; width: 100%; }
    .auth-view {
      position: absolute; top: 0; left: 0; width: 100%; opacity: 0; pointer-events: none; visibility: hidden;
      transition: opacity 0.35s ease, transform 0.4s cubic-bezier(0.4,0,0.2,1), visibility 0.4s;
      transform: translateX(20px);
    }
    .auth-view.active { position: relative; opacity: 1; pointer-events: auto; visibility: visible; transform: translateX(0); }
    .auth-view.exiting-left  { transform: translateX(-30px); position: absolute; }
    .auth-view.exiting-right { transform: translateX(30px);  position: absolute; }
    .auth-view.entering-left { transform: translateX(-30px); }
    .auth-form-group { margin-bottom: 18px; }
    .auth-label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 8px; color: var(--ink); margin-left: 4px; }
    .auth-input {
      width: 100%; height: 52px; border-radius: 14px; border: 1px solid rgba(0,0,0,0.04); background: #fff;
      padding: 0 18px; font-size: 14px; color: var(--ink); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s; font-family: inherit; box-sizing: border-box;
    }
    .auth-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,65,32,0.1); }
    .auth-hint { font-size: 11px; color: var(--muted); margin-top: 8px; margin-left: 4px; }
    .auth-forgot { display: inline-block; font-size: 12px; color: var(--ink); margin-top: 4px; font-weight: 600; text-decoration: none; }
    .auth-bottom-link { font-size: 12px; color: var(--muted); margin-top: 20px; text-align: left; }
    .auth-bottom-link a { color: var(--ink); font-weight: 700; text-decoration: none; }
    .auth-submit-btn {
      width: 100%; height: 54px; border-radius: 16px; background: var(--primary); color: #fff; border: none;
      font-size: 15px; font-weight: 700; margin-top: 24px; cursor: pointer;
      transition: transform 0.2s, background 0.3s ease; position: relative; overflow: hidden; font-family: inherit;
    }
    .auth-submit-btn:active { transform: scale(0.97); }
    .auth-submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .auth-submit-text { display: inline-block; transition: opacity 0.2s ease, transform 0.2s ease; }
    .auth-submit-text.fade-out { opacity: 0; transform: translateY(-5px); }
    .auth-submit-text.fade-in  { opacity: 0; transform: translateY(5px); animation: fadeInText 0.2s forwards ease; }
    @keyframes fadeInText { to { opacity: 1; transform: translateY(0); } }
    .role-toggle { display: flex; gap: 10px; margin-bottom: 22px; }
    .role-btn {
      flex: 1; height: 44px; border-radius: 999px; background: #fff; border: 1px solid rgba(0,0,0,0.04);
      display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13.5px; font-weight: 700;
      cursor: pointer; transition: all 0.2s; color: var(--ink); font-family: inherit;
    }
    .role-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    .role-dot { width: 14px; height: 14px; border-radius: 50%; }
    .role-dot.green { background: #08BF55; }
    .role-dot.gray  { background: #E0E0E0; }
    .auth-checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
    .auth-checkbox-group input { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }
    .auth-checkbox-group label { font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
    /* Message d'erreur API */
    .auth-error {
      display: none; background: #ffe8e5; color: #c0392b; border-radius: 12px;
      padding: 10px 14px; font-size: 13px; font-weight: 600; margin-top: 12px; text-align: center;
    }
    .hidden   { display: none !important; }
    .invisible { opacity: 0; pointer-events: none; position: absolute; }
  </style>
</head>
<body>
  <div class="auth-morph-page">
    <div class="auth-morph-card" id="authCard">
      <div class="auth-card-inner" id="authCardInner">

        <a href="#" id="backLink" class="auth-back-link hidden" data-action="goto" data-target="login">← Retour à la connexion</a>

        <div id="topIconContainer" class="top-icon-container hidden">
          <div class="success-circle">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
        </div>

        <h1 class="auth-morph-title" id="authTitle">Bon retour !</h1>
        <p class="auth-morph-subtitle" id="authSubtitle">Connecte-toi à ton compte Afiri.</p>

        <div class="auth-tabs" id="authTabs">
          <div class="auth-tab-indicator login-mode" id="tabIndicator"></div>
          <div class="auth-tab active" data-action="goto" data-target="login">Connexion</div>
          <div class="auth-tab"        data-action="goto" data-target="signup">Inscription</div>
        </div>

        <div class="auth-views-container">

          <!-- 1. Vue Connexion -->
          <div class="auth-view active" id="loginView">
            <div class="auth-form-group">
              <label class="auth-label">Adresse e-mail</label>
              <input type="email" class="auth-input" id="loginEmail" placeholder="josue@univ-yde.cm" required>
            </div>
            <div class="auth-form-group">
              <label class="auth-label">Mot de passe</label>
              <input type="password" class="auth-input" id="loginPassword" placeholder="••••••••" required>
            </div>
            <a href="#" class="auth-forgot" data-action="goto" data-target="forgot">Mot de passe oublié ?</a>
          </div>

          <!-- 2. Vue Inscription -->
          <div class="auth-view" id="signupView">
            <div class="role-toggle">
              <button type="button" class="role-btn active" data-role="etudiant"><div class="role-dot green"></div> Étudiant</button>
              <button type="button" class="role-btn"        data-role="entreprise"><div class="role-dot gray"></div> Entreprise</button>
            </div>
            <div class="auth-form-group">
              <label class="auth-label">Adresse e-mail</label>
              <input type="email" class="auth-input" id="signupEmail" placeholder="josue@univ-yde.cm" required>
            </div>
            <div class="auth-form-group">
              <label class="auth-label">Mot de passe</label>
              <input type="password" class="auth-input" id="signupPassword" placeholder="••••••••" required>
            </div>
            <div class="auth-checkbox-group">
              <input type="checkbox" id="terms" required>
              <label for="terms">J'accepte les conditions d'utilisation</label>
            </div>
          </div>

          <!-- 3. Vue Mot de passe oublié -->
          <div class="auth-view" id="forgotView">
            <div class="auth-form-group">
              <label class="auth-label">Ton adresse e-mail</label>
              <input type="email" class="auth-input" id="forgotEmail" placeholder="josue@univ-yde.cm" required>
              <div class="auth-hint">→ on va envoyer un code à cette adresse</div>
            </div>
            <div class="auth-bottom-link">Tu te souviens ? <a href="#" data-action="goto" data-target="login">Se connecter</a></div>
          </div>

          <!-- 4. Vue Code -->
          <div class="auth-view" id="codeView">
            <p style="font-size:13px;color:var(--muted);margin-bottom:16px;">Cette fonctionnalité sera disponible prochainement.</p>
            <div class="auth-bottom-link">Code expiré ? <a href="#">Renvoyer un nouveau code</a></div>
          </div>

          <!-- 5. Vue Succès inscription -->
          <div class="auth-view" id="successView">
            <!-- Le bouton principal gère la redirection -->
          </div>

        </div>

        <!-- Message d'erreur API -->
        <div class="auth-error" id="authError"></div>

        <button class="auth-submit-btn" id="mainSubmitBtn">
          <span class="auth-submit-text" id="submitBtnText">Se connecter</span>
        </button>

      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {

      // Si déjà connecté, aller directement à l'app
      if (Auth.isLoggedIn()) { window.location.href = 'app.html'; return; }

      const card          = document.getElementById('authCard');
      const inner         = document.getElementById('authCardInner');
      const tabs          = document.querySelectorAll('.auth-tab');
      const indicator     = document.getElementById('tabIndicator');
      const authTabsCont  = document.getElementById('authTabs');
      const authTitle     = document.getElementById('authTitle');
      const authSubtitle  = document.getElementById('authSubtitle');
      const backLink      = document.getElementById('backLink');
      const topIconCont   = document.getElementById('topIconContainer');
      const submitBtnText = document.getElementById('submitBtnText');
      const mainSubmitBtn = document.getElementById('mainSubmitBtn');
      const authError     = document.getElementById('authError');

      let currentMode = 'login';
      let selectedRole = 'etudiant';

      // ── Configuration des vues ──────────────────────────────────
      const viewsConfig = {
        login:   { title: "Bon retour !",           subtitle: "Connecte-toi à ton compte Afiri.", btnText: "Se connecter",    showTabs: true,  backLink: null,                               topIcon: false, centerText: false },
        signup:  { title: "Créer ton compte",       subtitle: "Rejoins la communauté Afiri.",     btnText: "Créer mon compte", showTabs: true,  backLink: null,                               topIcon: false, centerText: false },
        forgot:  { title: "Mot de passe oublié ?",  subtitle: "Entre ton e-mail pour recevoir un code.", btnText: "Envoyer le code", showTabs: false, backLink: { text: "← Retour à la connexion", target: "login" }, topIcon: false, centerText: false },
        code:    { title: "Entre ton code",         subtitle: "Code à 5 chiffres envoyé par email.", btnText: "Vérifier",       showTabs: false, backLink: { text: "← Retour", target: "forgot" }, topIcon: false, centerText: false },
        success: { title: "Compte créé !",          subtitle: "Ton compte Afiri est prêt. Bienvenue !", btnText: "Commencer →",  showTabs: false, backLink: null,                               topIcon: true,  centerText: true  },
      };

      // ── Mise à jour de la hauteur de la carte ──────────────────
      const updateCardHeight = () => {
        card.style.height = inner.getBoundingClientRect().height + 'px';
      };
      setTimeout(updateCardHeight, 50);
      window.addEventListener('resize', updateCardHeight);

      // ── Masquer l'erreur ───────────────────────────────────────
      function hideError() { authError.style.display = "none"; authError.textContent = ""; }
      function showError(msg) { authError.textContent = msg; authError.style.display = "block"; }

      // ── Transition entre vues ──────────────────────────────────
      const gotoMode = (targetMode) => {
        if (targetMode === currentMode) return;
        hideError();

        const config     = viewsConfig[targetMode];
        const currentView = document.getElementById(`${currentMode}View`);
        const nextView    = document.getElementById(`${targetMode}View`);

        // Tabs
        if (targetMode === 'login' || targetMode === 'signup') {
          tabs.forEach(t => t.classList.remove('active'));
          document.querySelector(`.auth-tab[data-target="${targetMode}"]`).classList.add('active');
          indicator.classList.toggle('signup-mode', targetMode === 'signup');
          indicator.classList.toggle('login-mode',  targetMode === 'login');
        }

        // Header
        authTitle.style.opacity    = '0';
        authSubtitle.style.opacity = '0';
        submitBtnText.classList.add('fade-out');
        authTabsCont.classList.toggle('hidden', !config.showTabs);
        topIconCont.classList.toggle('hidden', !config.topIcon);

        if (config.backLink) {
          backLink.innerHTML     = config.backLink.text;
          backLink.dataset.target = config.backLink.target;
          backLink.classList.remove('hidden');
        } else {
          backLink.classList.add('hidden');
        }

        setTimeout(() => {
          authTitle.textContent    = config.title;
          authSubtitle.textContent = config.subtitle;
          submitBtnText.textContent = config.btnText;
          authTitle.classList.toggle('center', config.centerText);
          authSubtitle.classList.toggle('center', config.centerText);
          authTitle.style.opacity    = '1';
          authSubtitle.style.opacity = '1';
          submitBtnText.classList.remove('fade-out');
          submitBtnText.classList.add('fade-in');
          setTimeout(() => submitBtnText.classList.remove('fade-in'), 200);
        }, 200);

        // Animation vue
        const backwards = (currentMode === 'signup' && targetMode === 'login')
                       || (currentMode === 'code'   && targetMode === 'forgot')
                       || (currentMode === 'forgot' && targetMode === 'login');

        if (backwards) {
          currentView.classList.remove('active'); currentView.classList.add('exiting-right');
          nextView.classList.remove('exiting-left','exiting-right'); nextView.classList.add('entering-left');
          void nextView.offsetWidth;
          nextView.classList.add('active'); nextView.classList.remove('entering-left');
        } else {
          currentView.classList.remove('active'); currentView.classList.add('exiting-left');
          nextView.classList.remove('exiting-left','exiting-right');
          nextView.style.transform = 'translateX(30px)';
          void nextView.offsetWidth;
          nextView.classList.add('active'); nextView.style.transform = '';
        }

        currentMode = targetMode;
        setTimeout(updateCardHeight, 20);
      };

      // ── Clic sur liens data-action="goto" ──────────────────────
      document.body.addEventListener('click', (e) => {
        const trigger = e.target.closest('[data-action="goto"]');
        if (trigger) { e.preventDefault(); gotoMode(trigger.dataset.target); }
      });

      // ── Sélection du rôle ──────────────────────────────────────
      document.querySelectorAll('.role-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedRole = btn.dataset.role;
        });
      });

      // ── Bouton principal ───────────────────────────────────────
      mainSubmitBtn.addEventListener('click', async () => {
        hideError();

        if (currentMode === 'login') {
          const email = document.getElementById('loginEmail').value.trim();
          const mdp   = document.getElementById('loginPassword').value;
          if (!email || !mdp) { showError("Remplis tous les champs."); return; }

          mainSubmitBtn.disabled = true;
          submitBtnText.textContent = "Connexion…";

          try {
            await ApiAuth.login(email, mdp);
            // Récupère les infos utilisateur pour les stocker localement
            await ApiAuth.fetchMe();
            window.location.href = 'app.html';
          } catch (err) {
            showError(err.message || "Email ou mot de passe incorrect.");
            submitBtnText.textContent = "Se connecter";
            mainSubmitBtn.disabled = false;
          }

        } else if (currentMode === 'signup') {
          const email = document.getElementById('signupEmail').value.trim();
          const mdp   = document.getElementById('signupPassword').value;
          const terms = document.getElementById('terms').checked;

          if (!email || !mdp) { showError("Remplis tous les champs."); return; }
          if (mdp.length < 6) { showError("Le mot de passe doit faire au moins 6 caractères."); return; }
          if (!terms)         { showError("Tu dois accepter les conditions."); return; }

          mainSubmitBtn.disabled = true;
          submitBtnText.textContent = "Création…";

          try {
            await ApiAuth.register(email, mdp, selectedRole);
            // Connexion automatique après inscription
            await ApiAuth.login(email, mdp);
            await ApiAuth.fetchMe();
            gotoMode('success');
          } catch (err) {
            showError(err.message || "Erreur lors de la création du compte.");
            submitBtnText.textContent = "Créer mon compte";
            mainSubmitBtn.disabled = false;
          }

        } else if (currentMode === 'forgot') {
          gotoMode('code');   // flow démo (pas d'envoi email réel)

        } else if (currentMode === 'code') {
          gotoMode('login');  // flow démo

        } else if (currentMode === 'success') {
          // Après inscription réussie → app
          window.location.href = selectedRole === 'etudiant' ? 'questionnaire.html' : 'app.html';
        }

        mainSubmitBtn.disabled = false;
      });

    });
  </script>
</body>
</html>
