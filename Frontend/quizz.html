<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Afiri - Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styliste.css">
</head>

<body>
    <div class="app-shell">
        <header class="pagebar">
            <a class="back-btn" href="app.html" aria-label="Retour">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="m15 18-6-6 6-6" />
                </svg>
            </a>
            <div><span class="page-kicker">Quiz</span><strong class="page-title">Évaluation</strong></div>
            <button class="more-btn" aria-label="Options">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="12" cy="5" r="1.8" />
                    <circle cx="12" cy="12" r="1.8" />
                    <circle cx="12" cy="19" r="1.8" />
                </svg>
            </button>
        </header>

        <main class="screen tight">
            <section class="white-card card-block" style="text-align:center;margin-top:60px;padding:50px 20px;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--tertiary)" stroke-width="2"
                    style="margin-bottom:20px;">
                    <path
                        d="M11 17h2v-2h-2zm1-14a6 6 0 0 0-6 6h4a2 2 0 1 1 2 2 3 3 0 0 0-3 3h4a1 1 0 0 1 1-1 6 6 0 0 0-2-10z" />
                </svg>
                <h1 style="font-size:22px;color:var(--burgundy);margin-bottom:15px;">Quiz d'orientation</h1>
                <p style="color:var(--muted);font-size:14px;line-height:1.5;">
                    Réponds à 4 questions pour découvrir les offres qui correspondent à ton profil et tes ambitions.
                </p>
                <a href="questionnaire.html" class="pill-action"
                    style="display:inline-flex;margin-top:30px;text-decoration:none;">Démarrer le quiz →</a>
            </section>

            <!-- Dernier résultat si disponible -->
            <section class="white-card card-block" id="dernierResultat" style="display:none;margin-top:0;padding:20px;">
                <h2 style="font-size:15px;margin-bottom:8px;">Ton dernier résultat</h2>
                <p id="dernierResultatTexte" style="color:var(--muted);font-size:14px;"></p>
                <a href="questionnaire.html"
                    style="font-size:13px;font-weight:700;color:var(--primary);text-decoration:none;">Refaire le quiz
                    →</a>
            </section>
        </main>

        <nav class="bottom-nav" aria-label="Navigation principale">
            <a class="nav-item" href="app.html"><span class="nav-icon"><svg viewBox="0 0 24 24">
                        <path d="M3 10.8 12 3l9 7.8v8.7a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5z" />
                    </svg></span><span>Accueil</span></a>
            <a class="nav-item" href="offres.html"><span class="nav-icon"><svg viewBox="0 0 24 24">
                        <path
                            d="M9 4h6a2 2 0 0 1 2 2v1h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3V6a2 2 0 0 1 2-2Zm0 3h6V6H9zM7 13h10v-2H7zm0 4h6v-2H7z" />
                    </svg></span><span>Offres</span></a>
            <a class="nav-item active" href="quizz.html"><span class="nav-icon"><svg viewBox="0 0 24 24">
                        <path
                            d="M11 17h2v-2h-2zm1-14a6 6 0 0 0-6 6h4a2 2 0 1 1 2 2 3 3 0 0 0-3 3h4a1 1 0 0 1 1-1 6 6 0 0 0-2-10z" />
                    </svg></span><span>Quiz</span></a>
            <a class="nav-item" href="profil.html"><span class="nav-icon"><svg viewBox="0 0 24 24">
                        <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm-9 9a9 9 0 0 1 18 0z" />
                    </svg></span><span>Profil</span></a>
        </nav>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="main.js"></script>
    <script>
        // Afficher le dernier résultat si disponible
        (async () => {
            if (!Auth.isLoggedIn()) return;
            try {
                const dernier = await ApiQuiz.monDernier();
                if (dernier && dernier.suggestions && dernier.suggestions.length > 0) {
                    document.getElementById("dernierResultat").style.display = "block";
                    document.getElementById("dernierResultatTexte").textContent =
                        `Suggestions : ${dernier.suggestions.slice(0, 3).join(", ")} — ${formaterDate(dernier.date_quiz)}`;
                }
            } catch (_) { /* pas de résultat encore */ }
        })();
    </script>
</body>

</html>
